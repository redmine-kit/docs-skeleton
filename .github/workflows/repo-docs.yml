# Builds the documentation site of a repository from its docs/ folder and
# deploys it to the repository's GitHub Pages
# (https://redmine-kit.github.io/<repo>/).
#
# Called from .github/workflows/docs.yml of each repository:
#
#   jobs:
#     docs:
#       if: github.repository_owner == 'redmine-kit'
#       uses: redmine-kit/docs-skeleton/.github/workflows/repo-docs.yml@main
#
# The caller grants `contents: read`, `pages: write` and `id-token: write`.
name: Repository docs

on:
  workflow_call:
    inputs:
      skeleton-ref:
        description: Branch, tag or SHA of redmine-kit/docs-skeleton to build with
        type: string
        default: main
      title:
        description: 'Site title (default: the first heading of docs/README.md)'
        type: string
        default: ''

jobs:
  build:
    # Never deploy from forks or from branches other than the default branch
    if: github.repository_owner == 'redmine-kit' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: source
          persist-credentials: false

      - uses: actions/checkout@v7.0.1
        with:
          repository: redmine-kit/docs-skeleton
          ref: ${{ inputs.skeleton-ref }}
          path: skeleton
          persist-credentials: false

      - name: Merge docs into skeleton
        run: |
          rsync -a source/docs/ skeleton/docs/
          cp skeleton/config.repo.js skeleton/config.js

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skeleton/package-lock.json

      # skeleton/.npmrc sets ignore-scripts=true
      - run: npm ci
        working-directory: skeleton

      - run: npm run docs:build
        working-directory: skeleton
        env:
          DOCS_REPOSITORY: ${{ github.repository }}
          DOCS_BRANCH: ${{ github.ref_name }}
          DOCS_SOURCE: ${{ github.workspace }}/source
          DOCS_TITLE: ${{ inputs.title }}
          DOCS_DESCRIPTION: ${{ github.event.repository.description }}

      - uses: actions/configure-pages@v6.0.0

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: skeleton/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
